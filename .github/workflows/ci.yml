name: ci

on:
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: koine
          POSTGRES_PASSWORD: koine
          POSTGRES_DB: koine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U koine -d koine"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm types

      - name: Install Playwright browser
        run: pnpm --filter @koine/web exec playwright install --with-deps chromium

      # meeting.route.test.ts deliberately imports `db` from `@/db/client` (the
      # DATABASE_URL database itself, not a cloned template) so its route
      # tests exercise real Drizzle rather than mocks. Nothing else migrates
      # that database in CI, so without this step `user`/`meeting`/
      # `participant` do not exist here and the first such test 500s.
      - name: Migrate the shared database
        run: pnpm --filter @koine/api db:migrate
        env:
          DATABASE_URL: postgres://koine:koine@localhost:5432/koine

      # The API tests clone an isolated database per test file from a migrated
      # template. The harness builds it on demand, but doing it here makes a
      # migration failure report as one instead of as a test failure.
      - name: Prepare API test database template
        run: pnpm --filter @koine/api test:setup

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm --filter @koine/web build

      - name: End-to-end tests
        run: pnpm --filter @koine/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
