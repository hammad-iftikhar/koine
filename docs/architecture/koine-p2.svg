<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1500 1040"><rect width="1500" height="1040" fill="#fff"/><defs><marker id="a-0A84FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0A84FF"/></marker><marker id="s-0A84FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0A84FF"/></marker><marker id="a-5A6169" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6169"/></marker><marker id="s-5A6169" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6169"/></marker><marker id="a-1C7A56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1C7A56"/></marker><marker id="s-1C7A56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1C7A56"/></marker><marker id="a-A86400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A86400"/></marker><marker id="s-A86400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A86400"/></marker></defs><text x="80" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#111318">Koine — Translation Pipeline</text><text x="80" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5A6169">One channel per target language, not per listener · cost scales with language diversity, not headcount</text><line x1="80" y1="124" x2="1420" y2="124" stroke="#C9CED6" stroke-width="1.2"/><rect x="80" y="160" width="1340" height="360" rx="16" fill="#F6F7F9" stroke="#C9CED6" stroke-width="1.2" stroke-dasharray="3 5"/><text x="102" y="187" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#5A6169">PER ROOM — TWO ROLES, ONE PROCESS IN V1</text><rect x="110" y="215" width="210" height="200" rx="11" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.6"/><text x="127" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">Floor audio</text><text x="127" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">All microphone tracks</text><text x="127" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Original language</text><text x="127" y="307" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169"></text><text x="127" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">One active speaker</text><text x="127" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">at a time</text><rect x="380" y="215" width="250" height="200" rx="11" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.6"/><text x="397" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">Transcriber</text><text x="397" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">1 per room</text><text x="397" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169"></text><text x="397" y="307" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Streaming STT</text><text x="397" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Translate to each</text><text x="397" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">target language</text><text x="397" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169"></text><text x="397" y="383" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Cannot be split</text><rect x="574" y="229" width="43" height="21" rx="10.5" fill="#0A84FF"/><text x="595.5" y="244" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">× 1</text><rect x="700" y="215" width="250" height="200" rx="11" fill="#FFFFFF" stroke="#111318" stroke-width="1.6"/><text x="717" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">CaptionSegment</text><text x="717" y="269" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">{ speakerIdentity,</text><text x="717" y="288" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">  sourceLang,</text><text x="717" y="307" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">  original,</text><text x="717" y="326" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">  translated,</text><text x="717" y="345" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">  final }</text><text x="717" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169"></text><text x="717" y="383" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Reliable data channel</text><rect x="1020" y="215" width="370" height="200" rx="11" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.6"/><text x="1037" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">Synthesizer</text><text x="1037" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">TTS per target language</text><text x="1037" y="288" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">publishes tr:&lt;lang&gt; track</text><text x="1037" y="307" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169"></text><text x="1037" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">The expensive half — one</text><text x="1037" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">pipeline per language</text><text x="1037" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169"></text><text x="1037" y="383" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Splits onto its own workers</text><text x="1037" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">when measurement says so</text><rect x="1280" y="229" width="97" height="21" rx="10.5" fill="#0A84FF"/><text x="1328.5" y="244" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">× 1 in v1</text><path d="M320 315 L380 315" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-0A84FF)"/><path d="M630 315 L700 315" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-0A84FF)"/><path d="M950 315 L1020 315" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-0A84FF)"/><text x="985.0" y="306.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0A84FF">fan out</text><text x="110" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">v1 runs both roles in one process, separated by a CaptionSegment message rather than a function call. That boundary already exists &#8212; the transcriber broadcasts segments for client captions anyway.</text><text x="110" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Splitting synthesizers onto their own workers is then a deployment change plus a Redis claim per (room, language) &#8212; not a rewrite. See module 06.</text><text x="80" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111318">Channel derivation</text><rect x="80" y="580" width="640" height="112" rx="11" fill="#F6F7F9" stroke="#C9CED6" stroke-width="1.4"/><text x="104" y="616" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13.5" fill="#111318">channels = distinct(participant.hear_lang)</text><text x="104" y="640" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13.5" fill="#111318">           &#8722; {'floor'} &#8722; {meeting.floor_lang}</text><text x="104" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Stored in Postgres, so a replacement worker rebuilds it without client help.</text><text x="770" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111318">What it costs</text><text x="770" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6169">25 people, 1 language</text><text x="1180" y="604" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1C7A56">0 channels</text><line x1="770" y1="616" x2="1420" y2="616" stroke="#C9CED6" stroke-width="1"/><text x="770" y="638" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6169">25 people, 4 languages</text><text x="1180" y="638" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1C7A56">4 channels</text><line x1="770" y1="650" x2="1420" y2="650" stroke="#C9CED6" stroke-width="1"/><text x="770" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6169">6 people, 6 languages</text><text x="1180" y="672" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#A86400">6 channels</text><line x1="770" y1="684" x2="1420" y2="684" stroke="#C9CED6" stroke-width="1"/><text x="770" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6169">Naive per-listener build</text><text x="1180" y="706" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C0392B">25 channels</text><line x1="770" y1="718" x2="1420" y2="718" stroke="#C9CED6" stroke-width="1"/><text x="80" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111318">At the listener</text><rect x="80" y="782" width="300" height="118" rx="11" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.6"/><text x="97" y="813" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">Translated voice</text><text x="97" y="836" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5A6169">tr:&lt;hear_lang&gt;</text><text x="97" y="855" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Gain 1.0</text><rect x="80" y="916" width="300" height="96" rx="11" fill="#EBF7F1" stroke="#1C7A56" stroke-width="1.6"/><text x="97" y="947" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">Floor audio</text><text x="97" y="970" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Original speaker</text><text x="97" y="989" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Gain 0.2 — ducked</text><path d="M380 841 L470 841 L470 905 L500 905" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-0A84FF)"/><path d="M380 964 L470 964 L470 905 L500 905" fill="none" stroke="#1C7A56" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-1C7A56)"/><rect x="500" y="862" width="250" height="86" rx="11" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.6"/><text x="517" y="893" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111318">Web Audio mix</text><text x="517" y="916" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Client-side GainNode</text><text x="500" y="990" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Tone and turn-taking survive even when the words do not.</text><text x="830" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111318">Latency budget</text><rect x="830" y="786" width="56.0" height="40" rx="6" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.4"/><text x="858.0" y="811" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0A84FF">150</text><text x="858.0" y="846" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6169">Capture</text><rect x="890.0" y="786" width="156.0" height="40" rx="6" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.4"/><text x="968.0" y="811" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0A84FF">400</text><text x="968.0" y="846" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6169">STT</text><rect x="1050.0" y="786" width="116.0" height="40" rx="6" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.4"/><text x="1108.0" y="811" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0A84FF">300</text><text x="1108.0" y="846" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6169">Translate</text><rect x="1170.0" y="786" width="156.0" height="40" rx="6" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.4"/><text x="1248.0" y="811" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0A84FF">400</text><text x="1248.0" y="846" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6169">TTS first byte</text><rect x="1330.0" y="786" width="56.0" height="40" rx="6" fill="#EDF5FF" stroke="#0A84FF" stroke-width="1.4"/><text x="1358.0" y="811" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0A84FF">150</text><text x="1358.0" y="846" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6169">Deliver</text><text x="830" y="890" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111318">Target &lt; 1.5 s &#183; hard ceiling 2.5 s</text><text x="830" y="914" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Past the ceiling this stops being a conversation and becomes a briefing.</text><text x="830" y="938" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Highest risk in the project. Measure before building UI on top of it.</text><text x="830" y="978" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">If TTS fails, captions continue and floor audio un-ducks.</text><text x="830" y="1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6169">Translation is an enhancement layer; it never stops the call.</text></svg>