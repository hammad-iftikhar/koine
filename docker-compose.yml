name: koine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koine
      POSTGRES_PASSWORD: koine
      POSTGRES_DB: koine
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koine -d koine"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No persistence in dev: Redis holds counters and coordination, never truth.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./docker/livekit.dev.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "7880:7880"        # signalling (HTTP/WS)
      - "7881:7881"        # WebRTC over TCP, fallback
      - "7882:7882/udp"    # single-port UDP mux
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --config.verify-deps-before-run=false: node_modules is baked into the image
  # and only sources are mounted, so pnpm's pre-run dependency check has nothing
  # to usefully compare against. Left on, it reinstalls on every start against a
  # store it re-derives from the mount, and fails.
  api:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    command: ["pnpm", "--config.verify-deps-before-run=false", "--filter", "@koine/api", "dev"]
    environment:
      DATABASE_URL: postgres://koine:koine@postgres:5432/koine
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # The API's own public URL. Better Auth builds the Google redirect_uri
      # from it (<base>/api/auth/callback/google); left unset it guesses from
      # the incoming request and warns on every boot.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GUEST_TOKEN_SECRET: ${GUEST_TOKEN_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173,http://localhost:4173}
    ports: ["3000:3000"]
    # Sources only. node_modules is image content and nothing is mounted over
    # a path inside another mount: Docker Desktop tears a volume mounted inside
    # a bind mount back down about a second after the container starts, after
    # which the host's macOS node_modules shows through the bind and the
    # container runs darwin-arm64 binaries. Dependency, config and manifest
    # changes therefore need `docker compose --profile apps up --build`.
    volumes: &src
      - ./apps/api/src:/app/apps/api/src
      - ./apps/agent/src:/app/apps/agent/src
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      livekit: { condition: service_healthy }

  agent:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    command: ["pnpm", "--config.verify-deps-before-run=false", "--filter", "@koine/agent", "dev"]
    environment:
      DATABASE_URL: postgres://koine:koine@postgres:5432/koine
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes: *src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      livekit: { condition: service_healthy }

  web:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    command: ["pnpm", "--config.verify-deps-before-run=false", "--filter", "@koine/web", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:3000
      # The browser reaches LiveKit from the host, not the compose network.
      VITE_LIVEKIT_URL: ws://localhost:7880
    ports: ["5173:5173"]
    volumes: *src

volumes:
  pgdata:
